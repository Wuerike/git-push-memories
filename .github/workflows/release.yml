name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32
        with:
          go-version: '1.25.12'
      - name: Build archives
        env:
          CGO_ENABLED: '0'
        run: |
          set -eu
          version="${GITHUB_REF_NAME}"
          license_directory="dist/dependency-licenses"
          mkdir -p "$license_directory"
          go mod download
          go list -m -f '{{if not .Main}}{{.Path}}|{{.Version}}|{{.Dir}}{{end}}' all | while IFS='|' read -r module version directory; do
            [ -n "$module" ] || continue
            destination="${license_directory}/$(printf '%s' "$module" | tr '/' '_')@${version}"
            mkdir -p "$destination"
            for license in "$directory"/LICENSE* "$directory"/NOTICE*; do
              if [ -f "$license" ]; then
                cp "$license" "$destination/"
              fi
            done
          done
          for architecture in amd64 arm64; do
            directory="dist/git-push-memories_linux_${architecture}"
            mkdir -p "$directory/third_party"
            GOOS=linux GOARCH="$architecture" go build \
              -ldflags "-s -w -X github.com/Wuerike/git-push-memories/internal/buildinfo.Version=${version}" \
              -o "$directory/gpm" ./cmd/gpm
            cp LICENSE THIRD_PARTY_NOTICES "$directory/"
            cp -R "$license_directory" "$directory/third_party/dependency-licenses"
            tar -C "$directory" -czf "dist/git-push-memories_linux_${architecture}.tar.gz" .
          done
          cd dist
          sha256sum git-push-memories_linux_*.tar.gz > checksums.txt
      - name: Smoke test
        run: |
          mkdir -p dist/smoke
          tar -xzf dist/git-push-memories_linux_amd64.tar.gz -C dist/smoke
          dist/smoke/gpm version | grep -F "${GITHUB_REF_NAME}"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes dist/git-push-memories_linux_amd64.tar.gz dist/git-push-memories_linux_arm64.tar.gz dist/checksums.txt
